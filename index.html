<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moneo | Pijamas</title>
<meta name="description" content="Encontre a Moneo no Instagram, WhatsApp e Facebook.">

<!-- ÍCONE QUE APARECE NA ABA DO NAVEGADOR E NO GOOGLE (favicon) -->
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">

<!-- PRÉVIA AO COMPARTILHAR O LINK NO WHATSAPP/INSTAGRAM -->
<meta property="og:title" content="Moneo | Pijamas">
<meta property="og:description" content="Aonde o descanso ganha cuidado, conforto e estilo com pijamas de alta qualidade, leves e aconchegantes.">
<meta property="og:image" content="og-image.png">
<meta property="og:type" content="website">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-0:#FBF7F1;
    --bg-1:#F4EDE3;
    --card:#F6F0E8;
    --card-hover:#EFE5D6;
    --brown-900:#684830;
    --brown-700:#5B4531;
    --brown-500:#8B6F52;
    --line:rgba(58,42,30,0.14);
    --shadow:rgba(58,42,30,0.10);
    --font-display:'Instrument Serif', Georgia, serif;
    --font-body:'Sora', -apple-system, sans-serif;
  }

  *{box-sizing:border-box;}

  html,body{
    margin:0;
    padding:0;
    min-height:100vh;
    font-family:var(--font-body);
    color:var(--brown-900);
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- IMAGEM DE FUNDO ---------- */

  #background-image{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    background-image:url('Fundo.png');
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    z-index:0;
    pointer-events:none;
  }

  .page{
    position:relative;
    z-index:2;
    max-width:440px;
    margin:0 auto;
    padding:64px 24px 40px;
    display:flex;
    flex-direction:column;
    align-items:center;
    min-height:100vh;
  }

  /* ---------- PERFIL ---------- */

  .logo-wrap{
    width:92px;
    height:92px;
    border-radius:50%;
    background:var(--card);
    border:1px solid var(--line);
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 6px 18px var(--shadow);
    overflow:hidden;
    margin-bottom:20px;
    opacity:0;
    animation:fadeUp .7s ease forwards;
    animation-delay:.05s;
  }

  .logo-img{
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:center;
  }

  .brand-name{
    font-family:var(--font-display);
    font-style:italic;
    font-weight:400;
    font-size:2.4rem;
    letter-spacing:0.01em;
    margin:0 0 14px;
    color:var(--brown-900);
    text-align:center;
    opacity:0;
    animation:fadeUp .7s ease forwards;
    animation-delay:.18s;
  }

  .brand-desc{
    font-family:var(--font-body);
    font-weight:400;
    font-size:0.95rem;
    line-height:1.65;
    color:var(--brown-700);
    max-width:300px;
    margin:0;
    text-align:center;
    opacity:0;
    animation:fadeUp .7s ease forwards;
    animation-delay:.30s;
  }

  /* ---------- DIVISOR "COSTURA" ---------- */

  .stitch{
    width:56px;
    height:1px;
    margin:32px 0;
    background:var(--brown-500);
    opacity:0;
    animation:fadeUp .7s ease forwards;
    animation-delay:.40s;
    position:relative;
  }

  .stitch::before,
  .stitch::after{
    content:"";
    position:absolute;
    top:50%;
    width:4px;
    height:4px;
    border-radius:50%;
    background:var(--brown-500);
    transform:translateY(-50%);
  }
  .stitch::before{ left:-2px; }
  .stitch::after{ right:-2px; }

  /* ---------- LINKS (card inteiro = imagem de fundo) ---------- */

  .links{
    width:100%;
    display:flex;
    flex-direction:column;
    gap:14px;
  }

  .link-card{
    position:relative;
    display:flex;
    align-items:center;
    justify-content:space-between;
    width:100%;
    height:100px;
    padding:16px 20px;
    border-radius:18px;
    overflow:hidden;
    text-decoration:none;
    background:linear-gradient(135deg, var(--brown-700), var(--brown-900));
    box-shadow:0 1px 3px var(--shadow);
    transition:transform .22s ease, box-shadow .22s ease;
    opacity:0;
    animation:fadeUp .6s ease forwards;
    -webkit-tap-highlight-color:transparent;
  }

  .link-card .link-label{
    position:relative;
    z-index:2;
    color:#ffffcc;
    font-family:var(--font-body);
    font-weight:600;
    font-size:1rem;
    letter-spacing:0.01em;
    text-shadow:0 1px 6px rgba(0,0,0,0.35);
  }

  /* ícone fixo, sem esticar, alinhado à direita */
  .link-card .link-icon{
    position:relative;
    z-index:2;
    width:32px;
    height:32px;
    flex-shrink:0;
    background-size:contain;
    background-position:center;
    background-repeat:no-repeat;
  }

  .link-card:nth-child(1){ animation-delay:.50s; }
  .link-card:nth-child(2){ animation-delay:.60s; }
  .link-card:nth-child(3){ animation-delay:.70s; }

  .link-card:hover{
    box-shadow:0 10px 24px var(--shadow);
    transform:translateY(-2px) scale(1.015);
  }

  .link-card:active{
    transform:scale(0.97);
    transition-duration:.1s;
  }

  .link-card:focus-visible{
    outline:2px solid var(--brown-500);
    outline-offset:3px;
  }

  /* ---------- RODAPÉ ---------- */

  .footer{
    margin-top:auto;
    padding-top:48px;
    text-align:center;
    opacity:0;
    animation:fadeUp .7s ease forwards;
    animation-delay:.85s;
  }

  .footer p{
    margin:0 0 6px;
    font-size:0.74rem;
    color:var(--brown-500);
    letter-spacing:0.01em;
  }

  .footer a{
    color:var(--brown-500);
    text-decoration:none;
    border-bottom:1px solid #ffffcc;
    transition:color .2s ease, border-color .2s ease;
  }

  .footer a:hover{
    color:var(--brown-700);
    border-color:var(--brown-700);
  }

  /* ---------- ANIMAÇÃO ---------- */

  @keyframes fadeUp{
    from{ opacity:0; transform:translateY(10px); }
    to{ opacity:1; transform:translateY(0); }
  }

  @media (prefers-reduced-motion: reduce){
    .brand-name, .brand-desc, .stitch, .link-card, .footer, .logo-wrap{
      animation:none !important;
      opacity:1 !important;
      transform:none !important;
    }
    .link-card:hover, .link-card:active{
      transform:none;
    }
  }

  @media (max-width:380px){
    .page{ padding:48px 18px 32px; }
    .brand-name{ font-size:2rem; }
  }
</style>
</head>
<body>

  <div id="background-image"></div>
  <div class="video-overlay"></div>

  <main class="page">

    <div class="logo-wrap" aria-label="Logo Moneo">
      <img src="Logo Moneo.png" alt="Moneo" class="logo-img">
    </div>

    <h1 class="brand-name">Moneo</h1>

    <h3 class="brand-desc">
      Aonde o descanso ganha cuidado, conforto e estilo com pijamas de alta qualidade, leves e aconchegantes.
    </h3>

    <div class="stitch" aria-hidden="true"></div>

    <nav class="links" aria-label="Canais oficiais da Moneo">

      <a class="link-card" href="https://www.instagram.com/usemoneo?igsi=bHE0dXkwM3RuM3Ro" target="_blank" rel="noopener noreferrer">
        <span class="link-label">Instagram</span>
        <span class="link-icon" style="background-image:url('Insta.png')"></span>
      </a>

      <a class="link-card" href="https://wa.me/5514996464098" target="_blank" rel="noopener noreferrer">
        <span class="link-label">WhatsApp</span>
        <span class="link-icon" style="background-image:url('Zap.png')"></span>
      </a>

      <a class="link-card" href="https://www.facebook.com/share/14rPNshyNgF/" target="_blank" rel="noopener noreferrer">
        <span class="link-label">Facebook</span>
        <span class="link-icon" style="background-image:url('Face.png')"></span>
      </a>

    </nav>

    <footer class="footer">
      <p>© Moneo 2026. Todos os direitos reservados.</p>
      <p>
        Desenvolvido por
        <a href="https://www.agenciabeltz.com.br" target="_blank" rel="noopener noreferrer">
          Agência Beltz
        </a>
      </p>
    </footer>

  </main>

</body>
</html>
