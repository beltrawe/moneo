<style>
  :root{
    --bg-0:#FBF7F1;
    --bg-1:#F4EDE3;
    --card:#F6F0E8;
    --card-hover:#EFE5D6;
    --brown-900:#684830;
    --brown-700:#5B4531;
    --brown-500:#8B6F52;
    --line:rgba(58,42,30,0.14);
    --shadow:rgba(58,42,30,0.10);
    --font-display:'Instrument Serif', Georgia, serif;
    --font-body:'Sora', -apple-system, sans-serif;
  }

  *{box-sizing:border-box;}

  html,body{
    margin:0;
    padding:0;
    min-height:100vh;
    font-family:var(--font-body);
    color:var(--brown-900);
    -webkit-font-smoothing:antialiased;
  }

  #background-image{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    background-image:url('Fundo.png');
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    z-index:0;
    pointer-events:none;
  }

  .page{
    position:relative;
    z-index:2;
    max-width:440px;
    margin:0 auto;
    padding:64px 24px 40px;
    display:flex;
    flex-direction:column;
    align-items:center;
    min-height:100vh;
  }

  .logo-wrap{
    width:92px;
    height:92px;
    border-radius:50%;
    background:var(--card);
    border:1px solid var(--line);
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 6px 18px var(--shadow);
    overflow:hidden;
    margin-bottom:20px;
    opacity:0;
    animation:fadeUp .7s ease forwards;
    animation-delay:.05s;
  }

  .logo-img{
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:center;
  }

  .brand-name{
    font-family:var(--font-display);
    font-style:italic;
    font-weight:400;
    font-size:2.4rem;
    letter-spacing:0.01em;
    margin:0 0 14px;
    color:var(--brown-900);
    text-align:center;
    opacity:0;
    animation:fadeUp .7s ease forwards;
    animation-delay:.18s;
  }

  .brand-desc{
    font-family:var(--font-body);
    font-weight:400;
    font-size:0.95rem;
    line-height:1.65;
    color:var(--brown-700);
    max-width:300px;
    margin:0;
    text-align:center;
    opacity:0;
    animation:fadeUp .7s ease forwards;
    animation-delay:.30s;
  }

  .stitch{
    width:56px;
    height:1px;
    margin:32px 0;
    background:var(--brown-500);
    opacity:0;
    animation:fadeUp .7s ease forwards;
    animation-delay:.40s;
    position:relative;
  }

  .stitch::before,
  .stitch::after{
    content:"";
    position:absolute;
    top:50%;
    width:4px;
    height:4px;
    border-radius:50%;
    background:var(--brown-500);
    transform:translateY(-50%);
  }
  .stitch::before{ left:-2px; }
  .stitch::after{ right:-2px; }

  .links{
    width:100%;
    display:flex;
    flex-direction:column;
    gap:14px;
  }

  /* ---------- CARD COM IMAGEM DE FUNDO ---------- */

  .link-card{
    position:relative;
    display:flex;
    align-items:center;
    justify-content:space-between;
    width:100%;
    height:100px;
    padding:16px 20px;
    border-radius:18px;
    overflow:hidden;
    text-decoration:none;
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    box-shadow:0 1px 3px var(--shadow);
    transition:transform .22s ease, box-shadow .22s ease;
    opacity:0;
    animation:fadeUp .6s ease forwards;
    -webkit-tap-highlight-color:transparent;
  }

  /* overlay escuro por cima da imagem, pra manter contraste do texto/ícone */
  .link-card::before{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(135deg, rgba(91,69,49,0.7), rgba(104,72,48,0.7));
    z-index:1;
  }

  /* AQUI VOCÊ TROCA CADA IMAGEM DE FUNDO */
  .link-card:nth-child(1){ background-image:url('Insta.png'); }
  .link-card:nth-child(2){ background-image:url('Zap.png'); }
  .link-card:nth-child(3){ background-image:url('Face.png'); }

  .link-card .link-label{
    position:relative;
    z-index:2;
    color:#ffffcc;
    font-family:var(--font-body);
    font-weight:600;
    font-size:1rem;
    letter-spacing:0.01em;
    text-shadow:0 1px 6px rgba(0,0,0,0.35);
  }

  .link-card .link-icon{
    position:relative;
    z-index:2;
    width:28px;
    height:28px;
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .link-card .link-icon svg{
    width:100%;
    height:100%;
    fill:#ffffcc;
  }

  .link-card:nth-child(1){ animation-delay:.50s; }
  .link-card:nth-child(2){ animation-delay:.60s; }
  .link-card:nth-child(3){ animation-delay:.70s; }

  .link-card:hover{
    box-shadow:0 10px 24px var(--shadow);
    transform:translateY(-2px) scale(1.015);
  }

  .link-card:active{
    transform:scale(0.97);
    transition-duration:.1s;
  }

  .link-card:focus-visible{
    outline:2px solid var(--brown-500);
    outline-offset:3px;
  }

  .footer{
    margin-top:auto;
    padding-top:48px;
    text-align:center;
    opacity:0;
    animation:fadeUp .7s ease forwards;
    animation-delay:.85s;
  }

  .footer p{
    margin:0 0 6px;
    font-size:0.74rem;
    color:var(--brown-500);
    letter-spacing:0.01em;
  }

  .footer a{
    color:var(--brown-500);
    text-decoration:none;
    border-bottom:1px solid #ffffcc;
    transition:color .2s ease, border-color .2s ease;
  }

  .footer a:hover{
    color:var(--brown-700);
    border-color:var(--brown-700);
  }

  @keyframes fadeUp{
    from{ opacity:0; transform:translateY(10px); }
    to{ opacity:1; transform:translateY(0); }
  }

  @media (prefers-reduced-motion: reduce){
    .brand-name, .brand-desc, .stitch, .link-card, .footer, .logo-wrap{
      animation:none !important;
      opacity:1 !important;
      transform:none !important;
    }
    .link-card:hover, .link-card:active{
      transform:none;
    }
  }

  @media (max-width:380px){
    .page{ padding:48px 18px 32px; }
    .brand-name{ font-size:2rem; }
  }
</style>
</head>
